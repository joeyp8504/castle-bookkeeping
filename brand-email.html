<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castle — Gmail / Email Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f0edf2;display:flex;flex-direction:column;align-items:center;padding:40px 20px;min-height:100vh}
.instructions{background:#fff;border:2px dashed #e8b5a1;border-radius:12px;padding:20px 32px;margin-bottom:40px;max-width:700px;text-align:center;font-size:14px;color:#4a4650;line-height:1.7}
.instructions strong{color:#2d2a33}
.instructions code{background:#f9f7fa;padding:2px 8px;border-radius:4px;font-size:13px;color:#e8b5a1;font-weight:600}
.label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#8a8490;margin-bottom:12px}

/* The 250x250 asset */
.asset{width:250px;height:250px;background:#e8b5a1;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.letter{font-family:'DM Serif Display',Georgia,serif;font-size:140px;color:#2d2a33;line-height:1;user-select:none}

/* Circle preview */
.preview-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#8a8490;margin-top:40px;margin-bottom:12px}
.preview{width:120px;height:120px;border-radius:50%;overflow:hidden;border:3px solid #ddd8e0}
.preview-inner{width:250px;height:250px;background:#e8b5a1;display:flex;align-items:center;justify-content:center;transform:scale(0.48);transform-origin:top left}
.preview-letter{font-family:'DM Serif Display',Georgia,serif;font-size:140px;color:#2d2a33;line-height:1}
</style>
</head>
<body>

<div class="instructions">
  <strong>Gmail / Email Profile Logo (250 x 250px)</strong><br>
  Press <code>Win + Shift + S</code> to open the Snipping Tool, then drag to capture the square below.<br>
  Gmail will crop this to a circle automatically. Save as PNG.
</div>
<div class="label">250 x 250px &mdash; Gmail Profile Photo</div>

<div class="asset">
  <div class="letter">C</div>
</div>

<div class="preview-label">Circle Preview (how it appears in Gmail)</div>
<div class="preview">
  <div class="preview-inner">
    <div class="preview-letter">C</div>
  </div>
</div>

</body>
</html>
